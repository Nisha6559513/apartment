<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input {
            width: 70%;
            padding: 8px;
            margin-right: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 12px;
            border: none;
            background: #28a745;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: #f1f1f1;
            padding: 10px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
        }
        .edit, .delete {
            cursor: pointer;
            margin-left: 10px;
            color: white;
            padding: 5px 8px;
            border-radius: 4px;
        }
        .edit {
            background: #007bff;
        }
        .delete {
            background: #dc3545;
        }
        .edit:hover {
            background: #0056b3;
        }
        .delete:hover {
            background: #c82333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>To-Do List</h2>
        <input type="text" id="taskInput" placeholder="Enter a task">
        <button onclick="addTask()">Add</button>
        <ul id="taskList"></ul>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadTasks);

        function addTask() {
            let taskInput = document.getElementById("taskInput");
            let taskText = taskInput.value.trim();
            if (taskText === "") return;

            let taskList = document.getElementById("taskList");
            let li = document.createElement("li");
            li.innerHTML = `
                <span>${taskText}</span>
                <div>
                    <button class="edit" onclick="editTask(this)">✏️ Edit</button>
                    <button class="delete" onclick="deleteTask(this)">🗑 Delete</button>
                </div>
            `;
            taskList.appendChild(li);
            saveTasks();
            taskInput.value = "";
        }

        function editTask(button) {
            let newTask = prompt("Edit your task:", button.parentElement.parentElement.firstElementChild.textContent);
            if (newTask) {
                button.parentElement.parentElement.firstElementChild.textContent = newTask;
                saveTasks();
            }
        }

        function deleteTask(button) {
            button.parentElement.parentElement.remove();
            saveTasks();
        }

        function saveTasks() {
            let tasks = [];
            document.querySelectorAll("#taskList li span").forEach(task => tasks.push(task.textContent));
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function loadTasks() {
            let savedTasks = JSON.parse(localStorage.getItem("tasks")) || [];
            savedTasks.forEach(task => {
                let li = document.createElement("li");
                li.innerHTML = `
                    <span>${task}</span>
                    <div>
                        <button class="edit" onclick="editTask(this)">✏️ Edit</button>
                        <button class="delete" onclick="deleteTask(this)">🗑 Delete</button>
                    </div>
                `;
                document.getElementById("taskList").appendChild(li);
            });
        }
    </script>

</body>
</html>
